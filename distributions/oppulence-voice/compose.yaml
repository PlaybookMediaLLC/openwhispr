name: oppulence-voice-local

x-rowboat-image: &rowboat-image
  image: ${ROWBOAT_API_IMAGE:-ghcr.io/oppulence-engineering/desktop-assistant-rowboat-api:production-latest}
  pull_policy: always

x-rowboat-environment: &rowboat-environment
  ENVIRONMENT: development
  LOG_LEVEL: info
  DATABASE_URL: postgres://rowboat:rowboat@postgres:5432/rowboat?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  AUTO_MIGRATE: "true"
  DB_ENCRYPTION_KEY: local-rowboat-encryption-key-32-bytes
  PUBLIC_BASE_URL: http://127.0.0.1:${OPPULENCE_VOICE_API_PORT:-28080}
  CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
  OIDC_ISSUER_URL: http://127.0.0.1:${OPPULENCE_VOICE_DEVSTACK_PORT:-28090}
  TOKEN_ISSUER: http://127.0.0.1:${OPPULENCE_VOICE_DEVSTACK_PORT:-28090}
  TOKEN_AUDIENCE: rowboat-api
  JWKS_URL: http://devstack:8090/.well-known/jwks.json
  WORKOS_CLIENT_ID: oppulence-voice-local
  WORKOS_API_KEY: local-workos-secret
  WORKOS_BASE_URL: http://devstack:8090
  WORKOS_AUTHORIZE_BASE_URL: http://127.0.0.1:${OPPULENCE_VOICE_DEVSTACK_PORT:-28090}
  OPENAI_BASE_URL: http://devstack:8090/v1
  OPENAI_API_KEY: local-openai-key
  OPENROUTER_BASE_URL: http://devstack:8090
  OPENROUTER_API_KEY: local-openrouter-key
  GOOGLE_OAUTH_CLIENT_ID: local-google-client
  GOOGLE_OAUTH_CLIENT_SECRET: local-google-secret
  GOOGLE_REDIRECT_URI: http://127.0.0.1:${OPPULENCE_VOICE_API_PORT:-28080}/oauth/google/callback
  GOOGLE_OAUTH_AUTHORIZE_URL: http://127.0.0.1:${OPPULENCE_VOICE_DEVSTACK_PORT:-28090}/o/oauth2/v2/auth
  GOOGLE_OAUTH_TOKEN_URL: http://devstack:8090/v1/google-oauth-mock/token
  HOOK_HMAC_SECRET: local-hook-secret
  INTERNAL_API_SECRET: local-internal-secret
  SLACK_SIGNING_SECRET: local-slack-secret
  GOOGLE_WEBHOOK_TOKEN: local-google-webhook-token
  WEBHOOK_SIGNING_SECRET: local-webhook-secret
  FREE_TIER_CREDITS: "10000"
  TEMPORAL_ENABLED: "true"
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: rowboat-api-background-tasks
  TEMPORAL_WORKER_ENABLED: "true"
  TEMPORAL_TLS_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rowboat
      POSTGRES_PASSWORD: rowboat
      POSTGRES_DB: rowboat
    ports:
      - "${OPPULENCE_VOICE_POSTGRES_PORT:-25433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowboat -d rowboat"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: rowboat
      POSTGRES_PWD: rowboat
      ENABLE_ES: "false"
    ports:
      - "${OPPULENCE_VOICE_TEMPORAL_PORT:-27233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address 127.0.0.1:7233 cluster health | grep -q SERVING"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    profiles: [tools]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${OPPULENCE_VOICE_TEMPORAL_UI_PORT:-28088}:8080"
    depends_on:
      temporal:
        condition: service_healthy

  devstack:
    <<: *rowboat-image
    entrypoint: ["/devstack"]
    environment:
      ADDR: :8090
      ISSUER: http://127.0.0.1:${OPPULENCE_VOICE_DEVSTACK_PORT:-28090}
      AUDIENCE: rowboat-api
    ports:
      - "${OPPULENCE_VOICE_DEVSTACK_PORT:-28090}:8090"

  api:
    <<: *rowboat-image
    environment: *rowboat-environment
    ports:
      - "${OPPULENCE_VOICE_API_PORT:-28080}:8080"
      - "${OPPULENCE_VOICE_GRPC_PORT:-28081}:8081"
      - "${OPPULENCE_VOICE_METRICS_PORT:-29090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      devstack:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *rowboat-image
    entrypoint: ["/rowboat-api-worker"]
    environment:
      <<: *rowboat-environment
      AUTO_MIGRATE: "false"
    depends_on:
      api:
        condition: service_started
      temporal:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
  redis-data:
