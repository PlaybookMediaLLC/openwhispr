name: Update Nix package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag=$(gh release view --json tagName -q .tagName)
          fi
          version="$tag"
          version="${version#v}"
          if ! echo "$version" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "::error::Invalid version format: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve Linux AppImage asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mapfile -t assets < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name | select(endswith("-linux-x86_64.AppImage"))'
          )
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one linux-x86_64 AppImage, found ${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          if ! echo "${assets[0]}" | grep -qE "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}-${RELEASE_VERSION}-linux-x86_64\.AppImage$"; then
            echo "::error::Unexpected AppImage asset name: ${assets[0]}"
            exit 1
          fi
          echo "name=${assets[0]}" >> "$GITHUB_OUTPUT"

      - name: Download AppImage and compute hash
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tmpdir=$(mktemp -d)
          gh release download "$RELEASE_TAG" \
            --pattern "$ASSET_NAME" \
            --dir "$tmpdir"
          tmpfile="$tmpdir/$ASSET_NAME"
          sri="sha256-$(sha256sum "$tmpfile" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
          rm -rf "$tmpdir"
          echo "sri=$sri" >> "$GITHUB_OUTPUT"

      - name: Update nix/package.nix
        id: update
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_HASH: ${{ steps.hash.outputs.sri }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const file = "nix/package.nix";
          const repository = process.env.RELEASE_REPOSITORY;
          const version = process.env.RELEASE_VERSION;
          const hash = process.env.RELEASE_HASH;
          const assetName = process.env.ASSET_NAME;
          const encodedAssetName = encodeURIComponent(assetName).replace(
            encodeURIComponent(version),
            "${version}"
          );
          const nixVersion = "${version}";
          const url = `https://github.com/${repository}/releases/download/v${nixVersion}/${encodedAssetName}`;
          const source = fs.readFileSync(file, "utf8");
          const requiredPatterns = [
            /version = ".*";/,
            /hash = "sha256-.*";/,
            /^\s*url = ".*";$/m,
          ];
          if (requiredPatterns.some((pattern) => !pattern.test(source))) {
            throw new Error("Could not find required Nix release metadata fields");
          }
          const updated = source
            .replace(requiredPatterns[0], `version = "${version}";`)
            .replace(requiredPatterns[1], `hash = "${hash}";`)
            .replace(requiredPatterns[2], `    url = "${url}";`);
          fs.writeFileSync(file, updated);
          NODE
          if git diff --quiet -- nix/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.release.outputs.version }}"
          branch="nix/update-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add nix/package.nix
          git commit -m "nix: update to ${version}"
          git push origin "$branch"

          gh pr create \
            --title "nix: update to ${version}" \
            --body "Automated bump of the Nix package to v${version}."
