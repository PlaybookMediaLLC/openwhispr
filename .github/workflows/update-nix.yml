name: Update Nix package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag=$(gh release view --json tagName -q .tagName)
          fi
          version="$tag"
          version="${version#v}"
          if ! echo "$version" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "::error::Invalid version format: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve Linux AppImage asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mapfile -t assets < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name | select(endswith("-linux-x86_64.AppImage"))'
          )
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one linux-x86_64 AppImage, found ${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          echo "name=${assets[0]}" >> "$GITHUB_OUTPUT"

      - name: Check if update needed
        id: check
        run: |
          current=$(grep 'version = ' nix/package.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.release.outputs.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AppImage and compute hash
        if: steps.check.outputs.skip != 'true'
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmpdir=$(mktemp -d)
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern "${{ steps.asset.outputs.name }}" \
            --dir "$tmpdir"
          tmpfile="$tmpdir/${{ steps.asset.outputs.name }}"
          sri="sha256-$(sha256sum "$tmpfile" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
          rm -rf "$tmpdir"
          echo "sri=$sri" >> "$GITHUB_OUTPUT"

      - name: Update nix/package.nix
        if: steps.check.outputs.skip != 'true'
        run: |
          version="${{ steps.release.outputs.version }}"
          hash="${{ steps.hash.outputs.sri }}"
          asset_name="${{ steps.asset.outputs.name }}"
          sed -i "s|version = \".*\";|version = \"${version}\";|" nix/package.nix
          sed -i "s|hash = \"sha256-.*\";|hash = \"${hash}\";|" nix/package.nix
          RELEASE_REPOSITORY="${{ github.repository }}" \
          RELEASE_VERSION="$version" \
          RELEASE_ASSET_NAME="$asset_name" \
          node <<'NODE'
          const fs = require("fs");
          const file = "nix/package.nix";
          const repository = process.env.RELEASE_REPOSITORY;
          const version = process.env.RELEASE_VERSION;
          const assetName = process.env.RELEASE_ASSET_NAME;
          const versionedAssetName = assetName.replace(version, "${version}");
          const nixVersion = "${version}";
          const url = `https://github.com/${repository}/releases/download/v${nixVersion}/${versionedAssetName}`;
          const source = fs.readFileSync(file, "utf8");
          const updated = source.replace(/^\s*url = ".*";$/m, `    url = "${url}";`);
          if (updated === source) throw new Error("Could not update Nix release URL");
          fs.writeFileSync(file, updated);
          NODE

      - name: Create pull request
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.release.outputs.version }}"
          branch="nix/update-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add nix/package.nix
          git commit -m "nix: update to ${version}"
          git push origin "$branch"

          gh pr create \
            --title "nix: update to ${version}" \
            --body "Automated bump of the Nix package to v${version}."
